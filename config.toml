[server]
# Serve merged output files from the ./static/ folder at URL app/static/...
# This lets large downloads stream from disk instead of living in the app's
# memory as a payload — the key to staying under Streamlit Cloud's 1 GB limit.
enableStaticServing = true

# Allow uploads up to 500 MB (two ~100 MB module copies + headroom).
maxUploadSize = 500
